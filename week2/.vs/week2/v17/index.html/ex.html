<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080d1b;
    color: white;
    font-family: Arial, sans-serif;
    padding: 25px;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    padding: 30px;
}

header h1 {
    color: #00e5ff;
    font-size: 38px;
    letter-spacing: 3px;
}

header p {
    color: #aaa;
    margin-top: 10px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: #151e33;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    border: 1px solid #263b5e;
}

.card h3 {
    color: #9baac5;
    font-size: 14px;
}

.card h2 {
    color: #00e5ff;
    margin-top: 12px;
    font-size: 30px;
}

.quiz-box {
    background: #151e33;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    border: 1px solid #263b5e;
}

.quiz-box h2 {
    margin-bottom: 25px;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

button {
    border: none;
    padding: 15px;
    border-radius: 10px;
    background: #253651;
    color: white;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
}

button:hover {
    background: #00bcd4;
    color: #07111e;
    transform: translateY(-2px);
}

.voice-btn {
    background: #7c3aed;
    width: 100%;
    margin-top: 20px;
    font-size: 18px;
}

#voiceStatus {
    margin-top: 15px;
    color: #00e5ff;
}

#result {
    margin-top: 15px;
    font-weight: bold;
}

.controls {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.controls button {
    flex: 1;
    background: #087f8c;
}

.subtitle {
    margin: 30px 0 15px;
    color: #00e5ff;
}

#playerList {
    display: grid;
    gap: 10px;
}

.player {
    background: #151e33;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
}

.eliminated {
    color: #ff5555;
}

@media(max-width: 550px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    .options {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 27px;
    }

    .controls {
        flex-direction: column;
    }
}
    </style>

<div class="container">
    <header>
        <h1>⚡ QUIZ ARENA</h1>
        <p>Voice Controlled Elimination Challenge</p>
    </header>

    <div class="dashboard">
        <div class="card">
            <h3>Players</h3>
            <h2 id="players">4</h2>
        </div>
        <div class="card">
            <h3>Round</h3>
            <h2 id="round">1</h2>
        </div>
        <div class="card">
            <h3>Eliminated</h3>
            <h2 id="eliminated">0</h2>
        </div>
    </div>

    <div class="quiz-box">
        <h2 id="question">What is the capital of Somalia?</h2>

        <div class="options">
            <button onclick="answer('Mogadishu')">A. Mogadishu</button>
            <button onclick="answer('Hargeisa')">B. Hargeisa</button>
            <button onclick="answer('Kismayo')">C. Kismayo</button>
            <button onclick="answer('Garowe')">D. Garowe</button>
        </div>

        <button class="voice-btn" onclick="startVoice()">
            🎤 Start Voice
        </button>

        <p id="voiceStatus">Voice is ready...</p>
        <p id="result"></p>
    </div>

    <div class="controls">
        <button onclick="nextQuestion()">Next Question</button>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <h2 class="subtitle">🏆 Players</h2>
    <div id="playerList"></div>
</div>

<script src="script.js"></script>
</body>
</html>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> src="ee.js"</script>
</body>
</html>
